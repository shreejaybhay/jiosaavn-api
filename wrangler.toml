name = "jiosaavn-api"
main = "./src/server.ts"
compatibility_date = "2024-09-28"

# Smart Placement: Run this worker closest to JioSaavn's servers (India)
# This makes outbound requests originate from Indian Cloudflare IPs
# which are far less likely to be blocked by JioSaavn
[placement]
mode = "smart"

[observability]
enabled = true
